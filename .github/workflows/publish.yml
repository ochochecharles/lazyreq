name: Publish LazyReq

on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:
    inputs:
      prerelease:
        description: 'Publish as pre-release (0.1.0 preview)'
        required: false
        default: 'true'
        type: choice
        options: ['true', 'false']

permissions:
  contents: read
  id-token: write  # Required for Trusted Publishing (OIDC)

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install deps
        run: npm ci

      - name: Typecheck + Lint + Build
        run: npm run package

      - name: Compile tests
        run: npm run compile-tests

      # Optional: run extension tests (requires xvfb on linux)
      # - name: Run tests
      #   uses: coactions/setup-xvfb@v1
      #   with:
      #     run: npm test

      - name: Publish to VS Code Marketplace (Trusted Publishing)
        run: |
          # v0.1.0 was manually uploaded via drag (Manage Publishers screenshot: Verifying 0.1.0),
          # so tag push of same version will error "Version already exists" – treat as success.
          set +e
          LOG=$(mktemp)
          if [ "${{ github.ref_type }}" = "tag" ]; then
            echo "Tag push: ${{ github.ref_name }} – publishing as pre-release" | tee $LOG
            npx --yes @vscode/vsce publish --trusted-publishing --pre-release 2>&1 | tee -a $LOG
            STATUS=${PIPESTATUS[0]}
          elif [ "${{ github.event.inputs.prerelease }}" = "false" ]; then
            npx --yes @vscode/vsce publish --trusted-publishing 2>&1 | tee $LOG
            STATUS=${PIPESTATUS[0]}
          else
            npx --yes @vscode/vsce publish --trusted-publishing --pre-release 2>&1 | tee $LOG
            STATUS=${PIPESTATUS[0]}
          fi
          if [ $STATUS -ne 0 ]; then
            if grep -qi "already exists\|Version.*exists" $LOG; then
              echo "✓ Version already exists – expected for re-run of v0.1.0, marking as success."
              exit 0
            fi
            echo "✗ Publish failed ($STATUS). If you see 'Trusted publisher not configured', do: https://marketplace.visualstudio.com/manage/publishers/ochoche -> Trusted Publishing -> Add GitHub ochochecharles/lazyreq + workflow publish.yml"
            cat $LOG
          fi
          exit $STATUS

      # Optional: also publish to Open VSX (uncomment if needed)
      # - name: Publish to Open VSX
      #   run: npx --yes ovsx publish --pre-release
